<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Peer Debug</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='Login-Page.css') }}">

</head>

<body>


<header class="navbar1">


    <div class="brand">

        <img src="{{ url_for('static', filename='Peer Debug logo.png') }}"
             alt="Peer Debug Logo">

        <span>
            Peer Debug
        </span>

    </div>


    <nav>

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('about') }}">
            About
        </a>

        <a href="{{ url_for('help_page') }}">
            Help
        </a>

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </nav>

</header>


<main class="login-container">


<div class="login-card">


    <h1>
        Create Account
    </h1>


    <p>
        Join the Peer Debug community
    </p>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form action="{{ url_for('register') }}"
          method="POST">


        <label>
            Name
        </label>


        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >


        <label>
            Email
        </label>


        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>


        <input
            type="password"
            name="password"
            placeholder="Create a password"
            minlength="6"
            required
        >


        <button type="submit"
                class="primary-btn">

            Create Account

        </button>


    </form>


    <p class="register-text">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </p>


</div>


</main>


<footer>

    <p>
        © 2026 Peer Debug. All rights reserved.
    </p>

</footer>


</body>

</html>
